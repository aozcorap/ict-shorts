<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'SG';font-weight:500;src:url(fonts/node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:'SG';font-weight:700;src:url(fonts/node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:'PM';font-weight:500;src:url(fonts/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2)}
@font-face{font-family:'PM';font-weight:600;src:url(fonts/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2)}
:root{--bg:#E9EDF3;--ink:#0D1117;--muted:#6A7586;--line:#C9D1DD;--blue:#2F5BFF;--orange:#E8590C;--green:#0CA678}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;color:var(--ink);font-family:'SG',sans-serif;
 background-color:var(--bg);background-image:radial-gradient(#C3CBD8 2px,transparent 2px);background-size:40px 40px}
#top{position:absolute;left:56px;right:56px;top:62px;display:flex;justify-content:space-between;font:500 28px 'PM',monospace;color:var(--muted)}
.win{position:absolute;left:48px;width:984px;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:10px 10px 0 var(--ink)}
.bar{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;font:500 26px 'PM',monospace;border-bottom:3px solid var(--ink)}
.bar i{width:18px;height:18px;border:3px solid var(--ink);border-radius:50%}
.bar span{margin-left:12px}
#wa{top:140px;height:1100px;background:#fff}
#wa .bar{background:#F4F6FA;color:var(--ink)}
#wa .body{position:absolute;top:64px;left:0;right:0;bottom:0;background-image:linear-gradient(#EEF1F6 2px,transparent 2px),linear-gradient(90deg,#EEF1F6 2px,transparent 2px);background-size:56px 56px}
#head{position:absolute;left:36px;top:26px}
#head .tag{display:inline-block;font:600 24px 'PM',monospace;color:#fff;background:var(--blue);padding:6px 14px;border-radius:8px}
#head h1{font-weight:700;font-size:104px;letter-spacing:-.04em;line-height:1;margin-top:14px}
#head p{font:500 30px 'PM',monospace;color:var(--muted);margin-top:10px}
#chart{position:absolute;left:0;top:0}
#wb{top:1260px;height:500px;background:var(--ink);color:#E8EDF5}
#wb .bar{background:#161C25;color:#9AA7BA;border-color:#2A3441}
#wb .bar i{border-color:#9AA7BA}
#log{position:absolute;top:64px;left:0;right:0;bottom:0;padding:24px 32px;font:600 42px/1.32 'PM',monospace;letter-spacing:-.02em}
.ln{display:flex;gap:22px;margin-bottom:14px}
.ln .n{color:#4B586B;font-weight:500;min-width:52px}
.ln .tx{color:#F4F7FB}
.ln.old .tx{color:#7C899C}
.ln mark{background:none;color:#7FA0FF;border-bottom:4px solid #7FA0FF}
.ln.old mark{color:#5D78C4;border-color:#5D78C4}
.cur{color:#7FA0FF}
#outro{position:absolute;top:64px;left:0;right:0;bottom:0;padding:44px 40px;opacity:0;background:var(--ink)}
#outro small{font:600 30px 'PM',monospace;color:#7FA0FF}
#outro h2{font-weight:700;font-size:84px;letter-spacing:-.04em;line-height:1.02;margin-top:18px;color:#fff}
#intro{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:9;background-color:var(--bg);background-image:radial-gradient(#C3CBD8 2px,transparent 2px);background-size:40px 40px;padding:0 80px}
#intro .tag{display:inline-block;font:600 34px 'PM',monospace;color:#fff;background:var(--blue);padding:8px 20px;border-radius:10px;margin-top:700px}
#intro h1{font-weight:700;font-size:190px;letter-spacing:-.045em;line-height:1;margin-top:28px}
#intro p{font:500 44px 'PM',monospace;color:var(--muted);margin-top:24px}
#steps{position:absolute;left:56px;top:1816px;display:flex;gap:10px;align-items:center;font:600 26px 'PM',monospace;color:var(--ink)}
#steps i{width:34px;height:34px;border:3px solid var(--ink);border-radius:6px;background:transparent}
#steps i.on{background:var(--blue);border-color:var(--ink)}
#steps span{margin-left:12px}
#foot{position:absolute;left:56px;top:1868px;font:500 24px 'PM',monospace;color:var(--muted)}
</style></head><body>
<div id="top"><span>@kanalname</span><span id="ep"></span></div>
<div class="win" id="wa"><div class="bar"><i></i><i></i><i></i><span id="wt"></span></div>
 <div class="body"><svg id="chart" width="984" height="1036" viewBox="0 0 984 1036"></svg>
  <div id="head"><span class="tag" id="tag"></span><h1 id="h1"></h1><p id="sub"></p></div></div></div>
<div class="win" id="wb"><div class="bar"><i></i><i></i><i></i><span>erklaerung.log</span></div><div id="log"></div>
 <div id="outro"><small id="osm"></small><h2 id="oh2"></h2></div></div>
<div id="intro"><span class="tag" id="itag"></span><h1 id="ih1"></h1><p id="isub"></p></div>
<div id="steps"></div><div id="foot">Lehrbeispiel, keine Anlageberatung</div>
<script>
const SPEC=__SPEC__;
const C=SPEC.candles,N=C.length;
const tc=new Array(N).fill(1e9);
SPEC.reveal.forEach(([i0,i1,t0,dt])=>{for(let i=i0;i<=i1;i++)tc[i]=t0+(i-i0)*dt;});
const W=984,H=1036,PT=235,PB=60,PL=36,PR=150,PMIN=SPEC.pmin,PMAX=SPEC.pmax;
const sp=(W-PL-PR)/N,bw=sp*.52;
const X=i=>PL+i*sp+sp/2,Y=p=>PT+(PMAX-p)/(PMAX-PMIN)*(H-PT-PB);
const INK='#0D1117';
const COL={blue:'#2F5BFF',orange:'#E8590C',green:'#0CA678',ink:INK,muted:'#6A7586'};
const caps=SPEC.caps.map(c=>({a:c[0],b:c[1],s:c[2].split('*').map((x,i)=>[x,i%2]).filter(x=>x[0])}));
const DUR=caps[caps.length-1].b+2.7, OUT=caps[caps.length-1].b+.1;
document.getElementById('ep').textContent=SPEC.ep;document.getElementById('wt').textContent=SPEC.slug.replace(/[0-9]+/,'')+'.chart';document.getElementById('tag').textContent=SPEC.tag;
{const I=SPEC.intro||{};document.getElementById('itag').textContent=I.tag||SPEC.tag;const ih=document.getElementById('ih1');ih.textContent=I.title||SPEC.title;ih.style.fontSize=((I.title||SPEC.title).length>12?132:190)+'px';document.getElementById('isub').textContent=I.sub||SPEC.sub;}
const h1=document.getElementById('h1');h1.textContent=SPEC.title;h1.style.fontSize=(SPEC.titleSize||104)+'px';
document.getElementById('sub').textContent=SPEC.sub;
document.getElementById('osm').textContent='$ next --'+SPEC.next.ep;document.getElementById('oh2').innerHTML=SPEC.next.title;
const steps=document.getElementById('steps');steps.innerHTML=caps.map(()=>'<i></i>').join('')+'<span></span>';
const sq=[...steps.querySelectorAll('i')],stl=steps.querySelector('span');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-cl(x),3);
function candle(i,t){
  const p=ease((t-tc[i])/.35);if(p<=0)return'';
  const [o,c,h,l]=C[i];const cc=o+(c-o)*p,hi=Math.max(o,cc)+(h-Math.max(o,c))*p,lo=Math.min(o,cc)-(Math.min(o,c)-l)*p;
  const up=c>=o,x=X(i),yo=Y(o),yc=Y(cc),top=Math.min(yo,yc),hh=Math.max(Math.abs(yo-yc),3);
  return `<line x1="${x}" x2="${x}" y1="${Y(hi)}" y2="${Y(lo)}" stroke="${INK}" stroke-width="3"/>
  <rect x="${x-bw/2}" y="${top}" width="${bw}" height="${hh}" fill="${up?'#fff':INK}" stroke="${INK}" stroke-width="3"/>`;
}
const F='font-family="PM" font-weight="600" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round"';
const xe=i=>i==='end'?W-PR:X(i);
function el(e,t,part){
  const k=ease((t-e.at)/(e.dur||.5)); if(k<=0) return '';
  const vis=e.until?Math.min(1,cl((e.until-t)/.2)):1; if(vis<=0) return ''; const o=k*vis;
  const c=COL[e.color||'blue'];
  if(e.type==='zone'){const x0=X(e.i0)-bw/2-6,x1=x0+((e.i1==='end'?W-PR:X(e.i1)+bw/2+6)-x0)*k,ya=Y(e.p1),yb=Y(e.p0);
    const shape=`<rect x="${x0}" y="${ya}" width="${x1-x0}" height="${yb-ya}" fill="${c}" opacity="${.16*vis}"/><rect x="${x0}" y="${ya}" width="${x1-x0}" height="${yb-ya}" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="14 8" opacity="${vis}"/>`;
    const lab=e.label?`<text ${F} x="${Math.max(40,x0)}" y="${e.labelBelow?yb+34:ya-14}" font-size="26" fill="${c}" opacity="${o}">${e.label}</text>`:'';
    return part==='label'?lab:shape;}
  if(e.type==='line'){const x0=X(e.i0),x1=x0+(xe(e.i1)-x0)*k;
    return `<line x1="${x0}" x2="${x1}" y1="${Y(e.p)}" y2="${Y(e.p)}" stroke="${c}" stroke-width="3" stroke-dasharray="10 8" opacity="${vis}"/>`+
      (e.label?`<text ${F} x="${Math.max(40,x0)}" y="${Y(e.p)+(e.labelBelow?34:-12)}" font-size="24" fill="${c}" opacity="${o}">${e.label}</text>`:'');}
  if(e.type==='ring'){const pulse=1+.1*Math.sin(t*7);return `<circle cx="${X(e.i)}" cy="${Y(e.p)}" r="${(e.r||34)*k*pulse}" fill="none" stroke="${c}" stroke-width="5" opacity="${vis}"/>`;}
  if(e.type==='label'){return `<text ${F} x="${X(e.i)}" y="${Y(e.p)}" font-size="${e.size||26}" fill="${c}" text-anchor="${e.anchor||'start'}" opacity="${o}">${e.text}</text>`;}
  return '';
}
function render(t){
  const I=SPEC.intro,io=document.getElementById('intro');if(I){const k=1-ease((t-(I.b-.5))/.5);io.style.opacity=k;io.style.display=k<=0?'none':'block';io.querySelector('h1').style.transform=`translateY(${(1-ease(t/.5))*24}px)`;}
  let s='';
  (SPEC.elements||[]).filter(e=>e.type==='zone').forEach(e=>s+=el(e,t,'shape'));
  for(let i=0;i<N;i++)s+=candle(i,t);
  (SPEC.elements||[]).forEach(e=>s+=el(e,t,'label'));
  document.getElementById('chart').innerHTML=s;
  const idx=caps.reduce((m,c,i)=>t>=c.a?i:m,-1);
  let html='';
  for(let i=Math.max(0,idx-2);i<=idx;i++){
    const cur=i===idx;let budget=cur?Math.floor(Math.max(0,t-caps[i].a)*38):1e9,tx='';
    for(const [str,h] of caps[i].s){const part=str.slice(0,Math.max(0,budget));budget-=str.length;if(part)tx+=h?`<mark>${part}</mark>`:part;}
    const blink=cur&&Math.floor(t*2)%2===0&&t<OUT?'<span class="cur">▌</span>':'';
    html+=`<div class="ln ${cur?'':'old'}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="tx">${tx}${blink}</span></div>`;
  }
  const lg=document.getElementById('log');lg.innerHTML=html;lg.style.opacity=SPEC.noOutro?1:1-ease((t-(OUT-.2))/.3);
  sq.forEach((e,i)=>e.className=(idx>=i&&t<OUT)||t>=OUT?'on':'');
  stl.textContent=t<OUT?`schritt ${String(Math.max(1,idx+1)).padStart(2,'0')}/${String(caps.length).padStart(2,'0')}`:'fertig';
  const o=SPEC.noOutro?0:ease((t-(OUT+.1))/.5),og=document.getElementById('outro');og.style.opacity=o;og.style.transform=`translateY(${(1-o)*30}px)`;
  document.getElementById('wa').style.opacity=1-.5*o;
}
render(0);
</script></body></html>
